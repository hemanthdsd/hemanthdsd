<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <defs>
    <!-- Background Blur Filter -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#5AC8FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#7D5CFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E8488B" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.15" />
    </pattern>

    <!-- Pill Gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="500" fill="#0B0B0F" />

  <!-- Background Glowing Orbs -->
  <circle cx="200" cy="400" r="300" fill="url(#cyanOrb)" filter="url(#blur)" opacity="0.6" />
  <circle cx="1200" cy="100" r="350" fill="url(#purpleOrb)" filter="url(#blur)" opacity="0.6" />
  <circle cx="700" cy="600" r="400" fill="url(#cyanOrb)" filter="url(#blur)" opacity="0.3" />

  <!-- Grid/Dot Pattern Overlay -->
  <rect width="1400" height="500" fill="url(#dotPattern)" />

  <!-- Content Group -->
  <g transform="translate(700, 250)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Top Pill -->
    <g transform="translate(0, -90)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="url(#pillBorder)" stroke-width="1" />
      <text x="0" y="5" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">AI &amp; Data Engineer</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="0" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Sai Durga Hemanth Davuloori
    </text>

    <!-- Sub-headline -->
    <text x="0" y="45" font-size="24" font-weight="400" fill="#86868B" letter-spacing="0">
      Building AI systems, full-stack products, and actionable intelligence.
    </text>
  </g>
</svg>
