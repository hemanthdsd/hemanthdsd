<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="1" />
      <stop offset="40%" stop-color="#0a0a0f" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0a0a0f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #0d1b2a; }
      .bg-card { fill: #112236; stroke: #1e3a5f; stroke-width: 1; rx: 16; }
      .text-ui-dark { fill: #42a5f5; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; }
      .text-ui-val { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 42px; font-weight: 700; }
      .badge-ui { fill: rgba(46, 125, 50, 0.2); rx: 12; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(450, -50) scale(1.1)">
    <!-- Dashboard Header -->
    <text x="50" y="100" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="700">Executive Dashboard</text>
    <rect x="50" y="120" width="800" height="2" fill="#1e3a5f" />

    <!-- KPI Grid -->
    <rect x="50" y="160" width="240" height="140" class="bg-card"/>
    <text x="75" y="200" class="text-ui-dark">Overall Yield</text>
    <text x="75" y="250" class="text-ui-val">95.8%</text>
    <rect x="200" y="185" width="70" height="24" class="badge-ui"/>

    <rect x="310" y="160" width="240" height="140" class="bg-card"/>
    <text x="335" y="200" class="text-ui-dark">First Pass Yield</text>
    <text x="335" y="250" class="text-ui-val">92.1%</text>

    <rect x="570" y="160" width="240" height="140" class="bg-card"/>
    <text x="595" y="200" class="text-ui-dark">Scrap Rate</text>
    <text x="595" y="250" class="text-ui-val">2.8%</text>

    <rect x="50" y="320" width="240" height="140" class="bg-card"/>
    <text x="75" y="360" class="text-ui-dark">Open Deviations</text>
    <text x="75" y="410" class="text-ui-val">4</text>
    <rect x="210" y="345" width="60" height="24" fill="rgba(211,47,47,0.2)" rx="12"/>

    <rect x="310" y="320" width="500" height="140" class="bg-card"/>
    <text x="335" y="360" class="text-ui-dark">Top Defect Categories</text>
    <rect x="335" y="400" width="200" height="12" fill="#1e3a5f" rx="6"/>
    <rect x="335" y="400" width="120" height="12" fill="#d32f2f" rx="6"/>
    <rect x="335" y="430" width="200" height="12" fill="#1e3a5f" rx="6"/>
    <rect x="335" y="430" width="60" height="12" fill="#f57c00" rx="6"/>
    
    <rect x="50" y="480" width="760" height="200" class="bg-card"/>
    <text x="75" y="530" class="text-ui-dark">Live Yield Trajectory</text>
    <path d="M 75 620 Q 200 580 300 600 T 500 550 T 700 500" fill="none" stroke="#1565c0" stroke-width="4"/>
  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">98% Match</text>
    <text x="120" y="0" class="tags">2026</text>
    <rect x="180" y="-16" width="40" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">APP</text>
    <text x="240" y="0" class="tags">Angular 18 • NestJS • pgvector</text>

    <!-- Title -->
    <text x="0" y="70" class="title">OpsInsight AI</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">An AI-assisted manufacturing deviation and yield-intelligence</text>
    <text x="0" y="150" class="desc">platform designed for controlled, regulated environments.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
