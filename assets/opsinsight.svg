<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <filter id="paper-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .card-bg { fill: transparent; }
    .layer { filter: url(#paper-shadow); fill: #ffffff; }
    .layer-accent { filter: url(#paper-shadow); fill: #f0f6fc; }
    .text-title { fill: #1f2328; font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
    .text-desc { fill: #656d76; font-family: -apple-system, sans-serif; font-size: 16px; }
    .text-tag { fill: #0969da; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .tag-bg { fill: #ddf4ff; rx: 4; }
    
    @media (prefers-color-scheme: dark) {
      .layer { fill: #161b22; }
      .layer-accent { fill: #21262d; }
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #8d96a0; }
      .text-tag { fill: #58a6ff; }
      .tag-bg { fill: #1f364d; }
    }
  </style>

  <!-- Background container -->
  <rect x="0" y="0" width="900" height="450" class="card-bg" />
  
  <!-- Main Card Layer -->
  <rect x="20" y="20" width="860" height="410" rx="16" class="layer" />

  <!-- Text Content -->
  <text x="60" y="100" class="text-title">OpsInsight AI</text>
  <text x="60" y="140" class="text-desc">AI-assisted manufacturing deviation and yield-intelligence platform.</text>

  <!-- Tags -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="85" height="24" class="tag-bg"/>
    <text x="42.5" y="16" text-anchor="middle" class="text-tag">Angular 18</text>
    
    <rect x="95" y="0" width="60" height="24" class="tag-bg"/>
    <text x="125" y="16" text-anchor="middle" class="text-tag">NestJS</text>
    
    <rect x="165" y="0" width="85" height="24" class="tag-bg"/>
    <text x="207.5" y="16" text-anchor="middle" class="text-tag">PostgreSQL</text>
    
    <rect x="260" y="0" width="60" height="24" class="tag-bg"/>
    <text x="290" y="16" text-anchor="middle" class="text-tag">Gemini</text>
    
    <rect x="330" y="0" width="70" height="24" class="tag-bg"/>
    <text x="365" y="16" text-anchor="middle" class="text-tag">pgvector</text>
  </g>

  <!-- Paper Diorama Art -->
  <g transform="translate(480, 60)">
    <!-- Base Panel -->
    <rect x="0" y="0" width="350" height="300" rx="12" class="layer-accent" />
    
    <!-- Chart Panel -->
    <rect x="20" y="20" width="200" height="180" rx="8" class="layer" />
    <!-- Chart Bars -->
    <rect x="40" y="100" width="30" height="80" rx="4" class="layer-accent" />
    <rect x="90" y="60" width="30" height="120" rx="4" class="layer-accent" />
    <rect x="140" y="40" width="30" height="140" rx="4" class="layer-accent" />
    
    <!-- Trend Line over Bars -->
    <path d="M 55 90 L 105 50 L 155 30" fill="none" stroke="#0969da" stroke-width="4" filter="url(#paper-shadow)" />

    <!-- AI Analysis Panel -->
    <rect x="235" y="20" width="95" height="260" rx="8" class="layer" />
    <!-- AI Lines and Elements -->
    <rect x="250" y="40" width="65" height="8" rx="4" class="layer-accent" />
    <rect x="250" y="60" width="45" height="8" rx="4" class="layer-accent" />
    <rect x="250" y="80" width="55" height="8" rx="4" class="layer-accent" />
    <circle cx="282.5" cy="140" r="25" class="layer-accent" />
    <rect x="250" y="185" width="65" height="8" rx="4" class="layer-accent" />
    <rect x="250" y="205" width="45" height="8" rx="4" class="layer-accent" />

    <!-- Bottom Stat Panel -->
    <rect x="20" y="220" width="200" height="60" rx="8" class="layer" />
    <rect x="40" y="240" width="160" height="20" rx="6" class="layer-accent" />
  </g>
</svg>
