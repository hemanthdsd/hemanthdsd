<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05080c" stop-opacity="1" />
      <stop offset="40%" stop-color="#05080c" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#05080c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#05080c" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #0d1117; }
      .bg-cell { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .text-ui-code { fill: #c9d1d9; font-family: 'Consolas', monospace; font-size: 16px; }
      .text-ui-kw { fill: #ff7b72; font-family: 'Consolas', monospace; font-size: 16px; font-weight: bold; }
      .text-ui-str { fill: #a5d6ff; font-family: 'Consolas', monospace; font-size: 16px; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(600, -20) scale(1.2) rotate(3)">
    
    <text x="50" y="80" fill="#c9d1d9" font-family="'Inter', sans-serif" font-size="20" font-weight="700">machine_learning_foundations.ipynb</text>
    
    <!-- Code Cell 1 -->
    <text x="20" y="140" fill="#58a6ff" font-family="'Consolas', monospace" font-size="14">In [42]:</text>
    <rect x="90" y="115" width="550" height="130" class="bg-cell"/>
    <text x="110" y="145" class="text-ui-code"><tspan class="text-ui-kw">import</tspan> pandas <tspan class="text-ui-kw">as</tspan> pd</text>
    <text x="110" y="175" class="text-ui-code"><tspan class="text-ui-kw">from</tspan> sklearn.linear_model <tspan class="text-ui-kw">import</tspan> LogisticRegression</text>
    <text x="110" y="205" class="text-ui-code"><tspan class="text-ui-kw">import</tspan> joblib</text>
    <text x="110" y="235" class="text-ui-code">df_train = pd.read_csv(<tspan class="text-ui-str">'train.csv'</tspan>)</text>
    
    <!-- Code Cell 2 -->
    <text x="20" y="295" fill="#58a6ff" font-family="'Consolas', monospace" font-size="14">In [43]:</text>
    <rect x="90" y="270" width="550" height="100" class="bg-cell"/>
    <text x="110" y="300" class="text-ui-code">lr_model = LogisticRegression(max_iter=1000)</text>
    <text x="110" y="330" class="text-ui-code">lr_model.fit(X_train_tfidf, y_train)</text>
    <text x="110" y="360" class="text-ui-code">joblib.dump(lr_model, <tspan class="text-ui-str">'logreg_improved_model.pkl'</tspan>)</text>

    <!-- Output -->
    <text x="110" y="410" fill="#8b949e" font-family="'Consolas', monospace" font-size="14">['logreg_improved_model.pkl']</text>

    <!-- Code Cell 3 -->
    <text x="20" y="465" fill="#58a6ff" font-family="'Consolas', monospace" font-size="14">In [44]:</text>
    <rect x="90" y="440" width="550" height="130" class="bg-cell"/>
    <text x="110" y="470" class="text-ui-code"><tspan class="text-ui-kw">from</tspan> wordcloud <tspan class="text-ui-kw">import</tspan> WordCloud</text>
    <text x="110" y="500" class="text-ui-code">text_data = <tspan class="text-ui-str">" "</tspan>.join(df_train[<tspan class="text-ui-str">'text'</tspan>])</text>
    <text x="110" y="530" class="text-ui-code">wordcloud = WordCloud(width=800, height=400)</text>
    <text x="110" y="560" class="text-ui-code">plt.imshow(wordcloud, interpolation=<tspan class="text-ui-str">'bilinear'</tspan>)</text>
  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">98% Match</text>
    <text x="120" y="0" class="tags">2024</text>
    <rect x="180" y="-16" width="30" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">R&amp;D</text>
    <text x="230" y="0" class="tags">Python • pandas • scikit-learn</text>

    <!-- Title -->
    <text x="0" y="70" class="title">ML Foundations</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">A machine-learning workflow covering exploratory analysis,</text>
    <text x="0" y="150" class="desc">logistic regression, NLP classification, and model evaluation.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
