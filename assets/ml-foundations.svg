    <rect x="70" y="0" width="890" height="120" class="cell code-bg"/>
    <rect x="70" y="0" width="890" height="120" class="cell" fill="transparent"/>
    
    <text x="90" y="25" class="text-code">
      <tspan class="keyword">from</tspan> sklearn.metrics <tspan class="keyword">import</tspan> classification_report, confusion_matrix
    </text>
    <text x="90" y="45" class="text-code">
      <tspan class="keyword">from</tspan> sklearn.linear_model <tspan class="keyword">import</tspan> LogisticRegression
    </text>
    <text x="90" y="65" class="text-code">
      <tspan class="comment"># Fit Logistic Regression on TF-IDF Vectors</tspan>
    </text>
    <text x="90" y="85" class="text-code">
      lr = LogisticRegression(max_iter=1000)
    </text>
    <text x="90" y="105" class="text-code">
      lr.fit(X_train_tfidf, y_train)
    </text>
  </g>

  <!-- Code Cell 2 -->
  <g transform="translate(20, 250)">
    <text x="5" y="20" class="text-code" fill="#0066cc">In [13]:</text>
    <rect x="70" y="0" width="890" height="60" class="cell code-bg"/>
    <rect x="70" y="0" width="890" height="60" class="cell" fill="transparent"/>
    
    <text x="90" y="25" class="text-code">
      y_pred = lr.predict(X_test_tfidf)
    </text>
    <text x="90" y="45" class="text-code">
      <tspan class="keyword">print</tspan>(classification_report(y_test, y_pred))
    </text>

    <!-- Output block -->
    <rect x="70" y="70" width="890" height="150" fill="transparent"/>
    <text x="90" y="90" class="text-output">              precision    recall  f1-score   support</text>
    <text x="90" y="110" class="text-output">           0       0.91      0.89      0.90      1240</text>
    <text x="90" y="130" class="text-output">           1       0.88      0.91      0.89      1180</text>
    <text x="90" y="150" class="text-output">    accuracy                           0.90      2420</text>
    <text x="90" y="170" class="text-output">   macro avg       0.90      0.90      0.90      2420</text>
    <text x="90" y="190" class="text-output">weighted avg       0.90      0.90      0.90      2420</text>
  </g>
  
  <!-- Code Cell 3 (Visualizations) -->
  <g transform="translate(20, 480)">
    <text x="5" y="20" class="text-code" fill="#0066cc">In [14]:</text>
    <rect x="70" y="0" width="890" height="100" class="cell code-bg"/>
    <rect x="70" y="0" width="890" height="100" class="cell" fill="transparent"/>
    
    <text x="90" y="25" class="text-code">
      <tspan class="comment"># Plot Confusion Matrix</tspan>
    </text>
    <text x="90" y="45" class="text-code">
      sns.heatmap(confusion_matrix(y_test, y_pred), annot=<tspan class="keyword">True</tspan>, fmt=<tspan class="string">'d'</tspan>, cmap=<tspan class="string">'Blues'</tspan>)
    </text>
    <text x="90" y="65" class="text-code">
      plt.title(<tspan class="string">'Logistic Regression Confusion Matrix'</tspan>)
    </text>
    <text x="90" y="85" class="text-code">
      plt.show()
    </text>
  </g>
</svg>
