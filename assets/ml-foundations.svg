<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .cell { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; rx: 4; }
      .code-bg { fill: #f8f9fa; }
      .text-code { font-family: 'Consolas', monospace; font-size: 13px; }
      .text-output { font-family: 'Consolas', monospace; font-size: 12px; fill: #495057; }
      .text-md { font-family: -apple-system, sans-serif; font-size: 15px; fill: #212529; }
      .keyword { fill: #0000ff; font-weight: bold; }
      .string { fill: #a31515; }
      .comment { fill: #008000; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .cell { fill: #161b22; stroke: #30363d; }
        .code-bg { fill: #0d1117; }
        .text-output { fill: #8b949e; }
        .text-md { fill: #c9d1d9; }
        .keyword { fill: #ff7b72; }
        .string { fill: #a5d6ff; }
        .comment { fill: #8b949e; }
      }
    </style>
  </defs>

  <rect width="1000" height="600" class="bg"/>

  <!-- Toolbar -->
  <rect x="0" y="0" width="1000" height="40" fill="#e9ecef" stroke="#dee2e6"/>
  <text x="20" y="25" font-family="-apple-system, sans-serif" font-weight="bold" fill="#495057">Jupyter</text>
  <text x="100" y="25" font-family="-apple-system, sans-serif" fill="#495057">machine_learning_pipeline.ipynb</text>

  <!-- Markdown Cell -->
  <g transform="translate(20, 60)">
    <rect width="960" height="40" class="cell" fill="transparent" stroke="none"/>
    <text x="20" y="25" class="text-md"><b>Model Evaluation:</b> Logistic Regression vs. Random Forest Classifier</text>
  </g>

  <!-- Code Cell 1 -->
  <g transform="translate(20, 110)">
