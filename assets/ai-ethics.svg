<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <filter id="paper-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .card-bg { fill: transparent; }
    .layer { filter: url(#paper-shadow); fill: #ffffff; }
    .layer-accent { filter: url(#paper-shadow); fill: #f0f6fc; }
    .text-title { fill: #1f2328; font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
    .text-desc { fill: #656d76; font-family: -apple-system, sans-serif; font-size: 16px; }
    .text-tag { fill: #0969da; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .tag-bg { fill: #ddf4ff; rx: 4; }
    
    @media (prefers-color-scheme: dark) {
      .layer { fill: #161b22; }
      .layer-accent { fill: #21262d; }
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #8d96a0; }
      .text-tag { fill: #58a6ff; }
      .tag-bg { fill: #1f364d; }
    }
  </style>

  <!-- Background container -->
  <rect x="0" y="0" width="900" height="450" class="card-bg" />
  
  <!-- Main Card Layer -->
  <rect x="20" y="20" width="860" height="410" rx="16" class="layer" />

  <!-- Text Content -->
  <text x="60" y="100" class="text-title">AI Ethics Auditing Simulation</text>
  <text x="60" y="140" class="text-desc">Applied simulation exploring responsible-AI auditing, fairness, and risk.</text>

  <!-- Tags -->
  <g transform="translate(60, 170)">
    <rect x="0" y="0" width="60" height="24" class="tag-bg"/>
    <text x="30" y="16" text-anchor="middle" class="text-tag">Python</text>
    
    <rect x="70" y="0" width="85" height="24" class="tag-bg"/>
    <text x="112.5" y="16" text-anchor="middle" class="text-tag">Simulation</text>
    
    <rect x="165" y="0" width="55" height="24" class="tag-bg"/>
    <text x="192.5" y="16" text-anchor="middle" class="text-tag">Ethics</text>
  </g>

  <!-- Paper Diorama Art -->
  <g transform="translate(480, 50)">
    <!-- Base Layer -->
    <rect x="0" y="20" width="360" height="300" rx="12" class="layer-accent" />
    
    <!-- Decision Tree Paths (Layered Paper Lines) -->
    <path d="M 180 260 L 180 180" fill="none" stroke="#ffffff" stroke-width="20" filter="url(#paper-shadow)" />
    <path d="M 180 180 L 80 80" fill="none" stroke="#ffffff" stroke-width="20" filter="url(#paper-shadow)" />
    <path d="M 180 180 L 280 80" fill="none" stroke="#ffffff" stroke-width="20" filter="url(#paper-shadow)" />

    <!-- Decision Nodes -->
    <circle cx="180" cy="180" r="16" class="layer" />
    <circle cx="80" cy="80" r="16" class="layer" />
    <circle cx="280" cy="80" r="16" class="layer" />

    <!-- Car Cutout -->
    <rect x="160" y="220" width="40" height="60" rx="8" class="layer" />
    <!-- Car details -->
    <rect x="165" y="230" width="30" height="15" rx="4" class="layer-accent" />
    <rect x="165" y="260" width="30" height="10" rx="4" class="layer-accent" />

    <!-- Scorecard Left (Risk Assessment) -->
    <rect x="20" y="30" width="120" height="100" rx="8" class="layer" />
    <rect x="30" y="45" width="80" height="8" rx="4" class="layer-accent" />
    <rect x="30" y="65" width="60" height="8" rx="4" class="layer-accent" />
    <!-- Red tinted bar indicating higher risk factor -->
    <rect x="30" y="85" width="100" height="10" rx="4" fill="#ffcccb" filter="url(#paper-shadow)" />
    <rect x="30" y="105" width="70" height="8" rx="4" class="layer-accent" />

    <!-- Scorecard Right (Fairness Assessment) -->
    <rect x="220" y="30" width="120" height="100" rx="8" class="layer" />
    <rect x="230" y="45" width="80" height="8" rx="4" class="layer-accent" />
    <rect x="230" y="65" width="60" height="8" rx="4" class="layer-accent" />
    <!-- Green tinted bar indicating positive fairness outcome -->
    <rect x="230" y="85" width="100" height="10" rx="4" fill="#d4edda" filter="url(#paper-shadow)" />
    <rect x="230" y="105" width="70" height="8" rx="4" class="layer-accent" />
  </g>
</svg>
