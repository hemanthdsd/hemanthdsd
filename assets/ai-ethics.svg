<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="1" />
      <stop offset="40%" stop-color="#050505" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#050505" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #111111; }
      .bg-panel { fill: #1e1e1e; stroke: #333333; stroke-width: 1; rx: 8; }
      .text-ui-code { fill: #cccccc; font-family: 'Consolas', monospace; font-size: 14px; }
      .text-alert { fill: #ff3333; font-family: 'Consolas', monospace; font-size: 16px; font-weight: bold; }
      .text-info { fill: #00ccff; font-family: 'Consolas', monospace; font-size: 14px; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(600, -20) scale(1.3) rotate(-3)">
    
    <!-- Simulation Grid Area -->
    <path d="M 100 0 L 100 520 M 200 0 L 200 520 M 300 0 L 300 520" stroke="#333333" stroke-width="1"/>
    <path d="M 0 100 L 500 100 M 0 200 L 500 200 M 0 300 L 500 300 M 0 400 L 500 400" stroke="#333333" stroke-width="1"/>
    
    <!-- Road lines -->
    <path d="M 200 0 L 200 600" stroke="#ffff00" stroke-width="2" stroke-dasharray="20, 20"/>
    <path d="M 50 0 L 50 600 M 350 0 L 350 600" stroke="#ffffff" stroke-width="2"/>

    <!-- Car (Autonomous Vehicle) -->
    <rect x="175" y="420" width="50" height="100" rx="4" fill="#007acc"/>
    
    <!-- Sensor Cone -->
    <path d="M 200 420 L 50 200 L 350 200 Z" fill="rgba(0, 204, 255, 0.15)" stroke="#00ccff" stroke-dasharray="4"/>

    <!-- Obstacles / Entities -->
    <rect x="160" y="250" width="80" height="20" fill="#ff3333"/>
    <circle cx="280" cy="270" r="12" fill="#ff9900"/>
    <circle cx="120" cy="320" r="12" fill="#ff9900"/>
    
    <!-- Trajectory Paths -->
    <path d="M 200 420 Q 200 350 120 270" fill="none" stroke="#ff3333" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 200 420 Q 200 350 280 270" fill="none" stroke="#ff3333" stroke-width="2" stroke-dasharray="5,5"/>
    <path d="M 200 420 L 200 270" fill="none" stroke="#00ff00" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Decision Log Panel -->
    <rect x="420" y="50" width="300" height="400" class="bg-panel"/>
    <text x="440" y="80" class="text-ui-code" font-weight="bold">AUDIT LOG MATRIX</text>
    <path d="M 440 90 L 700 90" stroke="#333333"/>
    
    <text x="440" y="130" class="text-alert">! OBSTACLE DETECTED !</text>
    <text x="440" y="150" class="text-info">Type: Static Barrier</text>
    <text x="440" y="170" class="text-info">Distance: 45m | TTC: 3.6s</text>
    
    <text x="440" y="220" class="text-ui-code">T-1 (Brake): </text>
    <text x="540" y="220" class="text-alert">Impact (Barrier)</text>
    
    <text x="440" y="250" class="text-ui-code">T-2 (Swerve): </text>
    <text x="540" y="250" class="text-alert">Impact (Pedestrian)</text>
    
    <text x="440" y="300" class="text-info">>>> MINIMIZE_HARM = T-1</text>
    <text x="440" y="320" fill="#00ff00" font-family="'Consolas', monospace">>>> EXECUTING HARD BRAKING</text>
  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">97% Match</text>
    <text x="120" y="0" class="tags">2023</text>
    <rect x="180" y="-16" width="30" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">R&amp;D</text>
    <text x="230" y="0" class="tags">Python • Simulation • Ethics</text>

    <!-- Title -->
    <text x="0" y="70" class="title">AI Ethics Auditing</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">An applied simulation exploring autonomous governance,</text>
    <text x="0" y="150" class="desc">algorithmic fairness, and measurable risk reduction.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
