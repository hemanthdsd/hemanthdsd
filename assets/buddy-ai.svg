<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d0d10; }
      .window { fill: #16161e; rx: 14; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
      .header { fill: #1e1e2e; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
      .text-title { fill: #e2e2f0; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; }
      .text-muted { fill: #8888aa; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; }
      .text-content { fill: #e2e2f0; font-family: 'Consolas', monospace; font-size: 13px; }
      .mode-btn { fill: #1e1e2e; rx: 8; stroke: rgba(255, 255, 255, 0.08); }
      .mode-btn-active { fill: rgba(124, 110, 245, 0.15); rx: 8; stroke: #7c6ef5; }
      .input-box { fill: #0d0d10; rx: 8; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
      .result-box { fill: #0d0d10; rx: 8; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; border-left: 3px solid #7c6ef5; }
    </style>
  </defs>

  <rect width="1000" height="600" class="bg"/>

  <!-- Main Floating Assistant Window -->
  <g transform="translate(250, 40)">
    <rect width="500" height="520" class="window"/>
    
    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 486 0 Q 500 0 500 14 L 500 40 L 0 40 Z" class="header"/>
    <rect x="16" y="12" width="16" height="16" fill="#7c6ef5" rx="4"/>
    <text x="44" y="25" class="text-title">Buddy AI</text>
    <text x="110" y="25" class="text-muted">qwen2.5:3b</text>
    
    <text x="400" y="25" class="text-muted">🟢 Ollama ready</text>
    <text x="480" y="25" fill="#8888aa" font-family="sans-serif">✕</text>
    
    <!-- Input Section -->
    <text x="20" y="70" class="text-muted">📋 Selected text</text>
    <rect x="20" y="85" width="460" height="80" class="input-box"/>
    <text x="32" y="110" class="text-content">function calculateYield(passed, failed) {</text>
    <text x="32" y="130" class="text-content">  return passed / (passed + failed);</text>
    <text x="32" y="150" class="text-content">}</text>

    <rect x="20" y="175" width="460" height="32" fill="#1e1e2e" stroke="rgba(255, 255, 255, 0.08)" rx="8"/>
    <text x="230" y="196" fill="#e2e2f0" font-size="13" font-family="'Inter', sans-serif">📸 Capture Screen</text>

    <!-- Modes Grid -->
    <text x="20" y="240" class="text-muted">Choose a mode</text>
    
    <rect x="20" y="255" width="145" height="28" class="mode-btn"/>
    <text x="55" y="274" fill="#e2e2f0" font-size="12" font-family="sans-serif">🚀 Enhance Prompt</text>
    
    <rect x="175" y="255" width="145" height="28" class="mode-btn"/>
    <text x="220" y="274" fill="#e2e2f0" font-size="12" font-family="sans-serif">✨ Improve Text</text>
    
    <rect x="330" y="255" width="150" height="28" class="mode-btn-active"/>
    <text x="375" y="274" fill="#7c6ef5" font-size="12" font-weight="600" font-family="sans-serif">📝 Fix Grammar</text>

    <rect x="20" y="295" width="145" height="28" class="mode-btn"/>
    <text x="50" y="314" fill="#e2e2f0" font-size="12" font-family="sans-serif">💼 Make Professional</text>

    <!-- Result Section -->
    <text x="20" y="355" class="text-muted">✨ Result</text>
    <text x="360" y="355" class="text-muted">📋 Copy</text>
    <text x="415" y="355" class="text-muted">⇄ Replace</text>
    
    <rect x="20" y="370" width="460" height="130" class="result-box"/>
    <!-- Simulated split output -->
    <text x="32" y="395" class="text-muted">Solution</text>
    <text x="32" y="420" class="text-content" fill="#5e9cf5">export const</text>
    <text x="120" y="420" class="text-content" fill="#4ade80">calculateYield</text>
    <text x="230" y="420" class="text-content" fill="#e2e2f0">= (passed:</text>
    <text x="310" y="420" class="text-content" fill="#7c6ef5">number</text>
    <text x="360" y="420" class="text-content" fill="#e2e2f0">, failed:</text>
    <text x="430" y="420" class="text-content" fill="#7c6ef5">number</text>
    <text x="32" y="440" class="text-content" fill="#e2e2f0">):</text>
    <text x="55" y="440" class="text-content" fill="#7c6ef5">number</text>
    <text x="110" y="440" class="text-content" fill="#5e9cf5">=></text>
    <text x="135" y="440" class="text-content" fill="#e2e2f0">{</text>
    <text x="32" y="460" class="text-content" fill="#e2e2f0">  return passed / (passed + failed);</text>
    <text x="32" y="480" class="text-content" fill="#e2e2f0">}</text>

    <!-- Purple Left Border for Result -->
    <path d="M 20 378 Q 20 370 28 370 L 28 500 Q 20 500 20 492 Z" fill="#7c6ef5"/>
  </g>
</svg>
