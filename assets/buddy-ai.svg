<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050508" stop-opacity="1" />
      <stop offset="40%" stop-color="#050508" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#050508" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #0d0d10; }
      .bg-card { fill: #16161e; stroke: rgba(255,255,255,0.05); stroke-width: 1; rx: 16; }
      .bg-inner { fill: #0d0d10; stroke: rgba(255,255,255,0.05); stroke-width: 1; rx: 8; }
      .text-ui-dark { fill: #e2e2f0; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500; }
      .text-ui-code { fill: #7c6ef5; font-family: 'Consolas', monospace; font-size: 16px; }
      .text-ui-code-dim { fill: #8888aa; font-family: 'Consolas', monospace; font-size: 16px; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(600, 20) scale(1.15) rotate(4)">
    
    <!-- Main Window -->
    <rect x="0" y="0" width="600" height="600" class="bg-card"/>
    <path d="M 0 16 Q 0 0 16 0 L 584 0 Q 600 0 600 16 L 600 48 L 0 48 Z" fill="#1e1e2e"/>
    <circle cx="24" cy="24" r="6" fill="#f87171"/>
    <circle cx="44" cy="24" r="6" fill="#facc15"/>
    <circle cx="64" cy="24" r="6" fill="#4ade80"/>
    <rect x="250" y="16" width="100" height="16" rx="8" fill="rgba(255,255,255,0.05)"/>

    <!-- Input Section -->
    <rect x="30" y="80" width="540" height="120" class="bg-inner"/>
    <text x="50" y="120" class="text-ui-code">function</text>
    <text x="130" y="120" class="text-ui-code" fill="#e2e2f0">optimizeComponent() {</text>
    <text x="50" y="150" class="text-ui-code-dim">  // Select code to improve</text>
    <text x="50" y="180" class="text-ui-code" fill="#e2e2f0">}</text>

    <!-- Action Buttons -->
    <rect x="30" y="230" width="160" height="40" rx="8" fill="rgba(124, 110, 245, 0.15)" stroke="#7c6ef5"/>
    <text x="60" y="255" fill="#7c6ef5" font-family="'Inter', sans-serif" font-weight="600" font-size="14">✨ Improve Code</text>

    <rect x="210" y="230" width="160" height="40" rx="8" class="bg-inner"/>
    <text x="240" y="255" fill="#e2e2f0" font-family="'Inter', sans-serif" font-weight="500" font-size="14">🚀 Refactor Logic</text>

    <!-- Output Box -->
    <rect x="30" y="300" width="540" height="200" class="bg-inner" style="border-left: 4px solid #7c6ef5;" />
    <path d="M 30 308 Q 30 300 38 300 L 38 500 Q 30 500 30 492 Z" fill="#7c6ef5"/>
    
    <text x="50" y="340" class="text-ui-code">export const</text>
    <text x="160" y="340" class="text-ui-code" fill="#4ade80">OptimizedComponent</text>
    <text x="50" y="370" class="text-ui-code" fill="#e2e2f0">  React.useMemo(() => {</text>
    <text x="50" y="400" class="text-ui-code-dim">    return heavyCalculation();</text>
    <text x="50" y="430" class="text-ui-code" fill="#e2e2f0">  }, [deps]);</text>

  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">99% Match</text>
    <text x="120" y="0" class="tags">2024</text>
    <rect x="180" y="-16" width="40" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">APP</text>
    <text x="240" y="0" class="tags">Electron • React • Ollama AI</text>

    <!-- Title -->
    <text x="0" y="70" class="title">Buddy AI</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">A local-first Windows writing and vision assistant</text>
    <text x="0" y="150" class="desc">powered entirely by private, offline Ollama inference.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
