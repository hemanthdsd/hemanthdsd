<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <filter id="paper-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .card-bg { fill: transparent; }
    .layer { filter: url(#paper-shadow); fill: #ffffff; }
    .layer-accent { filter: url(#paper-shadow); fill: #f0f6fc; }
    .text-title { fill: #1f2328; font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
    .text-desc { fill: #656d76; font-family: -apple-system, sans-serif; font-size: 16px; }
    .text-tag { fill: #0969da; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .tag-bg { fill: #ddf4ff; rx: 4; }
    
    @media (prefers-color-scheme: dark) {
      .layer { fill: #161b22; }
      .layer-accent { fill: #21262d; }
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #8d96a0; }
      .text-tag { fill: #58a6ff; }
      .tag-bg { fill: #1f364d; }
    }
  </style>

  <!-- Background container -->
  <rect x="0" y="0" width="900" height="450" class="card-bg" />
  
  <!-- Main Card Layer -->
  <rect x="20" y="20" width="860" height="410" rx="16" class="layer" />

  <!-- Text Content -->
  <text x="60" y="100" class="text-title">Buddy AI</text>
  <text x="60" y="140" class="text-desc">Local-first Windows writing and vision assistant</text>
  <text x="60" y="165" class="text-desc">powered by private Ollama inference.</text>

  <!-- Tags -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="70" height="24" class="tag-bg"/>
    <text x="35" y="16" text-anchor="middle" class="text-tag">Electron</text>
    
    <rect x="80" y="0" width="55" height="24" class="tag-bg"/>
    <text x="107.5" y="16" text-anchor="middle" class="text-tag">React</text>
    
    <rect x="145" y="0" width="85" height="24" class="tag-bg"/>
    <text x="187.5" y="16" text-anchor="middle" class="text-tag">TypeScript</text>
    
    <rect x="240" y="0" width="60" height="24" class="tag-bg"/>
    <text x="270" y="16" text-anchor="middle" class="text-tag">Ollama</text>
  </g>

  <!-- Paper Diorama Art -->
  <g transform="translate(480, 50)">
    <!-- Base IDE Window -->
    <rect x="0" y="20" width="340" height="270" rx="8" class="layer-accent" />
    
    <!-- IDE Header -->
    <rect x="0" y="20" width="340" height="30" rx="8" class="layer" />
    <circle cx="15" cy="35" r="4" fill="#ff5f56" />
    <circle cx="30" cy="35" r="4" fill="#ffbd2e" />
    <circle cx="45" cy="35" r="4" fill="#27c93f" />

    <!-- IDE Code Lines -->
    <rect x="20" y="70" width="120" height="8" rx="4" class="layer" />
    <rect x="20" y="90" width="200" height="8" rx="4" class="layer" />
    <rect x="40" y="110" width="180" height="8" rx="4" class="layer" />
    <rect x="40" y="130" width="150" height="8" rx="4" class="layer" />
    <rect x="20" y="150" width="80" height="8" rx="4" class="layer" />

    <!-- Floating Assistant Box (Overlaid) -->
    <rect x="100" y="110" width="260" height="170" rx="12" class="layer" />
    
    <!-- Assistant Header -->
    <circle cx="135" cy="140" r="16" class="layer-accent" />
    <rect x="165" y="135" width="140" height="10" rx="4" class="layer-accent" />
    
    <!-- Screen Capture Mini-view -->
    <rect x="120" y="170" width="220" height="90" rx="6" class="layer-accent" />
    
    <!-- Capture Elements within mini-view -->
    <polygon points="140,240 180,190 220,230 270,180 320,250" fill="#ddf4ff" filter="url(#paper-shadow)" />
    <rect x="140" y="180" width="40" height="40" rx="20" fill="#ffcccb" filter="url(#paper-shadow)" />
  </g>
</svg>
