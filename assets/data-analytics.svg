<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .card-bg { fill: transparent; }
    .layer { filter: url(#paper-shadow); fill: #ffffff; }
    .layer-accent { filter: url(#paper-shadow); fill: #f0f6fc; }
    .text-title { fill: #1f2328; font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
    .text-desc { fill: #656d76; font-family: -apple-system, sans-serif; font-size: 16px; }
    .text-tag { fill: #0969da; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .tag-bg { fill: #ddf4ff; rx: 4; }
    
    @media (prefers-color-scheme: dark) {
      .layer { fill: #161b22; }
      .layer-accent { fill: #21262d; }
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #8d96a0; }
      .text-tag { fill: #58a6ff; }
      .tag-bg { fill: #1f364d; }
    }
  </style>
  
  <rect class="layer" x="20" y="20" width="860" height="410" rx="16" />
  
  <g transform="translate(60, 60)">
    <text class="text-title" x="0" y="30">Quantitative Data Analytics</text>
    <text class="text-desc" x="0" y="70">Statistical research covering usability,</text>
    <text class="text-desc" x="0" y="95">workload, and advertising effectiveness.</text>
    
    <g transform="translate(0, 140)">
      <rect class="tag-bg" x="0" y="0" width="30" height="26" />
      <text class="text-tag" x="15" y="17" text-anchor="middle">R</text>
      
      <rect class="tag-bg" x="40" y="0" width="70" height="26" />
      <text class="text-tag" x="75" y="17" text-anchor="middle">RStudio</text>
      
      <rect class="tag-bg" x="120" y="0" width="85" height="26" />
      <text class="text-tag" x="162.5" y="17" text-anchor="middle">Regression</text>
      
      <rect class="tag-bg" x="215" y="0" width="50" height="26" />
      <text class="text-tag" x="240" y="17" text-anchor="middle">Stats</text>
    </g>
  </g>
  
  <!-- Diorama Art -->
  <g transform="translate(450, 40)">
    <rect class="layer-accent" x="0" y="0" width="370" height="350" rx="12" />
    
    <!-- Scatter Plot -->
    <g transform="translate(20, 20)">
      <rect class="layer" x="0" y="0" width="330" height="180" rx="8" />
      <line x1="30" y1="150" x2="300" y2="150" stroke="#8d96a0" stroke-width="2" />
      <line x1="30" y1="30" x2="30" y2="150" stroke="#8d96a0" stroke-width="2" />
      
      <!-- Dots -->
      <circle cx="60" cy="130" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="80" cy="110" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="95" cy="125" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="120" cy="100" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="150" cy="80" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="170" cy="95" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="210" cy="65" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="230" cy="50" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="260" cy="70" r="4" fill="#0969da" opacity="0.7"/>
      <circle cx="280" cy="40" r="4" fill="#0969da" opacity="0.7"/>
      
      <!-- Regression Line -->
      <line x1="40" y1="140" x2="290" y2="35" stroke="#bf3989" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- T-test output panel -->
    <g transform="translate(20, 220)">
      <rect class="layer" x="0" y="0" width="155" height="110" rx="8" />
      <rect class="layer-accent" x="15" y="15" width="80" height="12" rx="4" />
      <rect class="layer-accent" x="15" y="40" width="120" height="8" rx="4" />
      <rect class="layer-accent" x="15" y="55" width="100" height="8" rx="4" />
      <rect class="layer-accent" x="15" y="80" width="50" height="12" rx="4" fill="#2da44e" opacity="0.6"/>
    </g>
    
    <!-- ANOVA table mockup -->
    <g transform="translate(195, 220)">
      <rect class="layer" x="0" y="0" width="155" height="110" rx="8" />
      <rect class="layer-accent" x="15" y="15" width="60" height="12" rx="4" />
      
      <!-- Rows -->
      <rect class="layer-accent" x="15" y="40" width="30" height="8" rx="4" />
      <rect class="layer-accent" x="55" y="40" width="20" height="8" rx="4" />
      <rect class="layer-accent" x="85" y="40" width="40" height="8" rx="4" />
      
      <rect class="layer-accent" x="15" y="60" width="30" height="8" rx="4" />
      <rect class="layer-accent" x="55" y="60" width="20" height="8" rx="4" />
      <rect class="layer-accent" x="85" y="60" width="40" height="8" rx="4" />
      
      <rect class="layer-accent" x="15" y="80" width="30" height="8" rx="4" />
      <rect class="layer-accent" x="55" y="80" width="20" height="8" rx="4" />
      <rect class="layer-accent" x="85" y="80" width="40" height="8" rx="4" />
    </g>
  </g>
</svg>
