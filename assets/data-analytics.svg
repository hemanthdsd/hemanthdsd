<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f0f0f0; }
      .panel { fill: #ffffff; stroke: #d0d0d0; stroke-width: 1; }
      .header { fill: #e0e0e0; stroke: #d0d0d0; stroke-width: 1; }
      .text-title { fill: #333333; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: bold; }
      .text-code { fill: #2b91af; font-family: 'Consolas', monospace; font-size: 13px; }
      .text-comment { fill: #008000; font-family: 'Consolas', monospace; font-size: 13px; }
      .text-output { fill: #333333; font-family: 'Consolas', monospace; font-size: 12px; }
      .axis-line { stroke: #333333; stroke-width: 1; }
      .scatter-pt { fill: rgba(0, 102, 204, 0.4); stroke: #0066cc; stroke-width: 1; }
      .reg-line { stroke: #cc0000; stroke-width: 2; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1e1e1e; }
        .panel { fill: #252526; stroke: #3e3e42; }
        .header { fill: #2d2d30; stroke: #3e3e42; }
        .text-title { fill: #cccccc; }
        .text-code { fill: #4ec9b0; }
        .text-comment { fill: #608b4e; }
        .text-output { fill: #d4d4d4; }
        .axis-line { stroke: #cccccc; }
        .scatter-pt { fill: rgba(86, 156, 214, 0.4); stroke: #569cd6; }
        .reg-line { fill: none; stroke: #f44336; stroke-width: 2; }
      }
    </style>
  </defs>

  <rect width="1000" height="600" class="bg"/>

  <!-- Top Left: Source Code -->
  <g transform="translate(10, 10)">
    <rect width="480" height="340" class="panel"/>
    <rect width="480" height="25" class="header"/>
    <text x="10" y="17" class="text-title">Assignment_DSD.R *</text>
    
    <text x="10" y="50" class="text-comment"># Objective: Analyze Usability vs Workload in Voice UIs</text>
    <text x="10" y="70" class="text-code">df &lt;- read.csv("SusRtlx.csv")</text>
    <text x="10" y="90" class="text-code">cor.test(df$SUS, df$RTLX)</text>
    <text x="10" y="110" class="text-comment"># Generate Scatter Plot (Positive Correlation)</text>
    <text x="10" y="130" class="text-code">library(ggplot2)</text>
    <text x="10" y="150" class="text-code">ggplot(df, aes(x=RTLX, y=SUS)) +</text>
    <text x="10" y="170" class="text-code">  geom_point(alpha=0.6, color="blue") +</text>
    <text x="10" y="190" class="text-code">  geom_smooth(method="lm", color="red") +</text>
    <text x="10" y="210" class="text-code">  theme_minimal() +</text>
    <text x="10" y="230" class="text-code">  labs(title="Correlation: Workload vs Usability")</text>
  </g>

  <!-- Bottom Left: Console Output -->
  <g transform="translate(10, 360)">
    <rect width="480" height="230" class="panel"/>
    <rect width="480" height="25" class="header"/>
    <text x="10" y="17" class="text-title">Console</text>

    <text x="10" y="50" class="text-output">&gt; cor.test(df$SUS, df$RTLX)</text>
    <text x="10" y="75" class="text-output">	Pearson's product-moment correlation</text>
    
    <text x="10" y="105" class="text-output">data:  df$SUS and df$RTLX</text>
    <text x="10" y="120" class="text-output">t = 8.421, df = 98, p-value &lt; 2.2e-16</text>
    <text x="10" y="135" class="text-output">alternative hypothesis: true correlation is not equal to 0</text>
    
    <text x="10" y="165" class="text-output">95 percent confidence interval:</text>
    <text x="10" y="180" class="text-output"> 0.55124  0.78432</text>
    <text x="10" y="210" class="text-output">sample estimates:</text>
    <text x="10" y="225" class="text-output">      cor </text>
    <text x="10" y="240" class="text-output" font-weight="bold">   0.6899 </text>
  </g>

  <!-- Right: Plots Pane -->
  <g transform="translate(500, 10)">
    <rect width="490" height="580" class="panel"/>
    <rect width="490" height="25" class="header"/>
    <text x="10" y="17" class="text-title">Plots</text>
    
    <text x="245" y="70" class="text-title" font-size="16" text-anchor="middle">Correlation: Workload vs Usability (Unexpected)</text>
    
    <!-- Plot Area -->
    <g transform="translate(60, 100)">
      <!-- Grid -->
      <path d="M 0 50 L 380 50 M 0 150 L 380 150 M 0 250 L 380 250 M 0 350 L 380 350" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4"/>
      <!-- Axes -->
      <path d="M 0 400 L 400 400" class="axis-line"/>
      <path d="M 0 0 L 0 400" class="axis-line"/>
      
      <!-- Axis Labels -->
      <text x="-40" y="200" class="text-title" transform="rotate(-90, -40, 200)" text-anchor="middle">SUS (System Usability Scale)</text>
      <text x="200" y="440" class="text-title" text-anchor="middle">RTLX (NASA Task Load Index)</text>
      
      <!-- Scatter Points (Positive Correlation trend this time) -->
      <circle cx="50" cy="350" r="5" class="scatter-pt"/>
      <circle cx="80" cy="320" r="5" class="scatter-pt"/>
      <circle cx="120" cy="280" r="5" class="scatter-pt"/>
      <circle cx="150" cy="240" r="5" class="scatter-pt"/>
      <circle cx="200" cy="210" r="5" class="scatter-pt"/>
      <circle cx="250" cy="180" r="5" class="scatter-pt"/>
      <circle cx="280" cy="150" r="5" class="scatter-pt"/>
      <circle cx="320" cy="100" r="5" class="scatter-pt"/>
      <circle cx="350" cy="60" r="5" class="scatter-pt"/>
      
      <circle cx="100" cy="340" r="5" class="scatter-pt"/>
      <circle cx="160" cy="270" r="5" class="scatter-pt"/>
      <circle cx="220" cy="200" r="5" class="scatter-pt"/>
      <circle cx="300" cy="140" r="5" class="scatter-pt"/>
      <circle cx="360" cy="80" r="5" class="scatter-pt"/>

      <circle cx="70" cy="300" r="5" class="scatter-pt"/>
      <circle cx="130" cy="250" r="5" class="scatter-pt"/>
      <circle cx="180" cy="230" r="5" class="scatter-pt"/>
      <circle cx="260" cy="160" r="5" class="scatter-pt"/>
      <circle cx="340" cy="110" r="5" class="scatter-pt"/>
      
      <!-- Regression Line (Positive) -->
      <path d="M 20 380 L 380 50" class="reg-line"/>
      <!-- Confidence Interval Shading -->
      <path d="M 20 390 L 380 80 L 380 20 L 20 370 Z" fill="#999999" fill-opacity="0.2"/>
    </g>
  </g>
</svg>
