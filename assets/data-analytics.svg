<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="1" />
      <stop offset="40%" stop-color="#050505" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#050505" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #1e1e1e; }
      .bg-panel { fill: #252526; stroke: #3e3e42; stroke-width: 1; rx: 8; }
      .text-ui-code { fill: #4ec9b0; font-family: 'Consolas', monospace; font-size: 16px; }
      .text-ui-comment { fill: #608b4e; font-family: 'Consolas', monospace; font-size: 16px; }
      .text-ui-out { fill: #d4d4d4; font-family: 'Consolas', monospace; font-size: 14px; }
      .axis-line { stroke: #cccccc; stroke-width: 1; }
      .scatter-pt { fill: rgba(86, 156, 214, 0.4); stroke: #569cd6; stroke-width: 1; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(500, 20) scale(1.1) rotate(2)">
    
    <!-- Code Editor -->
    <rect x="0" y="0" width="500" height="250" class="bg-panel"/>
    <text x="20" y="40" class="text-ui-comment"># Analyze Usability vs Workload in Voice UIs</text>
    <text x="20" y="70" class="text-ui-code">df &lt;- read.csv("SusRtlx.csv")</text>
    <text x="20" y="100" class="text-ui-code">cor.test(df$SUS, df$RTLX)</text>
    <text x="20" y="130" class="text-ui-comment"># Generate Scatter Plot (Positive Correlation)</text>
    <text x="20" y="160" class="text-ui-code">ggplot(df, aes(x=RTLX, y=SUS)) +</text>
    <text x="20" y="190" class="text-ui-code">  geom_point(alpha=0.6, color="blue") +</text>
    <text x="20" y="220" class="text-ui-code">  geom_smooth(method="lm", color="red")</text>

    <!-- Console Output -->
    <rect x="0" y="280" width="500" height="300" class="bg-panel"/>
    <text x="20" y="320" class="text-ui-out">&gt; cor.test(df$SUS, df$RTLX)</text>
    <text x="20" y="350" class="text-ui-out">	Pearson's product-moment correlation</text>
    <text x="20" y="390" class="text-ui-out">data:  df$SUS and df$RTLX</text>
    <text x="20" y="410" class="text-ui-out">t = 8.421, df = 98, p-value &lt; 2.2e-16</text>
    <text x="20" y="460" class="text-ui-out">sample estimates:</text>
    <text x="20" y="480" class="text-ui-out">      cor </text>
    <text x="20" y="500" class="text-ui-out" font-weight="bold">   0.6899 </text>
    <text x="20" y="540" fill="#f44336" font-family="'Consolas', monospace" font-size="14"># Unexpected finding: Usability correlates with Workload</text>

    <!-- Plot Area -->
    <rect x="530" y="0" width="400" height="580" class="bg-panel"/>
    <text x="730" y="40" fill="#cccccc" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SUS vs RTLX Correlation</text>
    
    <g transform="translate(580, 80)">
      <!-- Axes -->
      <path d="M 0 400 L 300 400" class="axis-line"/>
      <path d="M 0 0 L 0 400" class="axis-line"/>
      
      <!-- Scatter Points -->
      <circle cx="50" cy="350" r="5" class="scatter-pt"/>
      <circle cx="80" cy="320" r="5" class="scatter-pt"/>
      <circle cx="120" cy="280" r="5" class="scatter-pt"/>
      <circle cx="150" cy="240" r="5" class="scatter-pt"/>
      <circle cx="200" cy="210" r="5" class="scatter-pt"/>
      <circle cx="250" cy="180" r="5" class="scatter-pt"/>
      <circle cx="280" cy="150" r="5" class="scatter-pt"/>
      
      <circle cx="100" cy="340" r="5" class="scatter-pt"/>
      <circle cx="160" cy="270" r="5" class="scatter-pt"/>
      <circle cx="220" cy="200" r="5" class="scatter-pt"/>
      
      <!-- Regression Line -->
      <path d="M 20 380 L 280 120" fill="none" stroke="#f44336" stroke-width="3"/>
    </g>

  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">95% Match</text>
    <text x="120" y="0" class="tags">2022</text>
    <rect x="180" y="-16" width="30" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">R&amp;D</text>
    <text x="230" y="0" class="tags">R • RStudio • Hypothesis testing</text>

    <!-- Title -->
    <text x="0" y="70" class="title">Data Analytics</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">Statistical research and visual analysis covering usability,</text>
    <text x="0" y="150" class="desc">workload, and advertising campaign effectiveness.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
