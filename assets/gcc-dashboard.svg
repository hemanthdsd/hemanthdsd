<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Gradient (Netflix Style) -->
    <linearGradient id="ottGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1" />
      <stop offset="40%" stop-color="#0a0a0a" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0a0a0a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subdued UI Colors for Background -->
    <style>
      .bg-base { fill: #1c1c1c; }
      .bg-card { fill: #2c2c2c; stroke: #404040; stroke-width: 1; rx: 8; }
      .text-ui-dark { fill: #daddd8; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500; }
      .text-ui-val { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 42px; font-weight: 700; }
      
      .title { fill: #ffffff; font-family: 'Inter', -apple-system, sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .match { fill: #4ade80; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .tags { fill: #a1a1aa; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
      .desc { fill: #d4d4d8; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 400; line-height: 1.5; }
      
      .btn-play { fill: #ffffff; rx: 8; }
      .btn-text { fill: #000000; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
      .btn-secondary { fill: rgba(255, 255, 255, 0.2); rx: 8; }
      .btn-text-sec { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" class="bg-base"/>

  <!-- Background UI Layer (The "Movie Scene" offset to the right/top) -->
  <g transform="translate(600, 50) scale(1.1) rotate(2)">
    
    <!-- Dashboard Header -->
    <text x="50" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="700">GCC Operations Center</text>
    <rect x="50" y="100" width="800" height="1" fill="#404040" />

    <!-- KPI Grid -->
    <rect x="50" y="140" width="240" height="120" class="bg-card"/>
    <text x="75" y="180" class="text-ui-dark" fill="#64748B">SLA Compliance</text>
    <text x="75" y="230" class="text-ui-val">98.4%</text>

    <rect x="310" y="140" width="240" height="120" class="bg-card"/>
    <text x="335" y="180" class="text-ui-dark" fill="#64748B">Active Incidents (P1)</text>
    <text x="335" y="230" class="text-ui-val">3</text>
    <rect x="380" y="200" width="40" height="30" fill="#EF4444" rx="4"/>

    <rect x="570" y="140" width="240" height="120" class="bg-card"/>
    <text x="595" y="180" class="text-ui-dark" fill="#64748B">Handovers</text>
    <text x="595" y="230" class="text-ui-val">12</text>

    <!-- Main Chart -->
    <rect x="50" y="280" width="500" height="300" class="bg-card"/>
    <text x="75" y="320" class="text-ui-dark">Incident Volume (24h)</text>
    <path d="M 75 350 L 525 350 M 75 420 L 525 420 M 75 490 L 525 490" stroke="#404040" stroke-dasharray="4"/>
    <path d="M 75 520 Q 150 400 250 450 T 400 350 T 525 380" fill="none" stroke="#3B82F6" stroke-width="4"/>
    
    <!-- Alerts List -->
    <rect x="570" y="280" width="240" height="300" class="bg-card"/>
    <text x="595" y="320" class="text-ui-dark">Live Alerts</text>
    
    <rect x="595" y="350" width="12" height="12" rx="6" fill="#EF4444"/>
    <text x="620" y="360" fill="#daddd8" font-family="'Inter', sans-serif" font-weight="700">Node EU-West Down</text>

    <rect x="595" y="400" width="12" height="12" rx="6" fill="#F59E0B"/>
    <text x="620" y="410" fill="#daddd8" font-family="'Inter', sans-serif" font-weight="700">High CPU DB-04</text>
  </g>

  <!-- OTT Gradient Overlay (The Vignette) -->
  <rect width="1280" height="720" fill="url(#ottGradient)"/>

  <!-- OTT Foreground Metadata (Bottom Left Anchor) -->
  <g transform="translate(80, 420)">
    
    <!-- Badges / Tags -->
    <text x="0" y="0" class="match">96% Match</text>
    <text x="120" y="0" class="tags">2023</text>
    <rect x="180" y="-16" width="40" height="22" fill="none" stroke="#a1a1aa" stroke-width="1" rx="4"/>
    <text x="188" y="-1" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">APP</text>
    <text x="240" y="0" class="tags">HTML5 • Vanilla CSS • JavaScript</text>

    <!-- Title -->
    <text x="0" y="70" class="title">GCC Dashboard</text>

    <!-- Description -->
    <text x="0" y="120" class="desc">A high-performance operational metrics dashboard</text>
    <text x="0" y="150" class="desc">built for Global Command Center incident tracking.</text>

    <!-- Action Buttons -->
    <rect x="0" y="190" width="200" height="56" class="btn-play"/>
    <path d="M 40 208 L 40 228 L 56 218 Z" fill="#000000"/>
    <text x="70" y="225" class="btn-text">View Project</text>

    <rect x="220" y="190" width="200" height="56" class="btn-secondary"/>
    <circle cx="250" cy="218" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 213 L 250 223 M 245 218 L 255 218" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="225" class="btn-text-sec">Source Code</text>

  </g>

</svg>
