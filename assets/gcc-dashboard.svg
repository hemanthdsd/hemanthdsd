<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .card-bg { fill: transparent; }
    .layer { filter: url(#paper-shadow); fill: #ffffff; }
    .layer-accent { filter: url(#paper-shadow); fill: #f0f6fc; }
    .text-title { fill: #1f2328; font-family: -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
    .text-desc { fill: #656d76; font-family: -apple-system, sans-serif; font-size: 16px; }
    .text-tag { fill: #0969da; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .tag-bg { fill: #ddf4ff; rx: 4; }
    
    @media (prefers-color-scheme: dark) {
      .layer { fill: #161b22; }
      .layer-accent { fill: #21262d; }
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #8d96a0; }
      .text-tag { fill: #58a6ff; }
      .tag-bg { fill: #1f364d; }
    }
  </style>
  
  <rect class="layer" x="20" y="20" width="860" height="410" rx="16" />
  
  <g transform="translate(60, 60)">
    <text class="text-title" x="0" y="30">GCC Dashboard</text>
    <text class="text-desc" x="0" y="70">Interactive data visualization and metrics dashboard.</text>
    
    <g transform="translate(0, 140)">
      <rect class="tag-bg" x="0" y="0" width="80" height="26" />
      <text class="text-tag" x="40" y="17" text-anchor="middle">JavaScript</text>
      
      <rect class="tag-bg" x="90" y="0" width="80" height="26" />
      <text class="text-tag" x="130" y="17" text-anchor="middle">Dashboard</text>
      
      <rect class="tag-bg" x="180" y="0" width="60" height="26" />
      <text class="text-tag" x="210" y="17" text-anchor="middle">Metrics</text>
    </g>
  </g>
  
  <!-- Diorama Art -->
  <g transform="translate(450, 40)">
    <!-- Dashboard Base -->
    <rect class="layer-accent" x="0" y="0" width="370" height="350" rx="12" />
    
    <!-- Sidebar Navigation -->
    <rect class="layer" x="10" y="10" width="60" height="330" rx="8" />
    <rect class="layer-accent" x="20" y="25" width="40" height="15" rx="4" />
    <circle cx="40" cy="70" r="10" fill="#0969da" opacity="0.8"/>
    <circle cx="40" cy="110" r="10" fill="#8d96a0" opacity="0.4"/>
    <circle cx="40" cy="150" r="10" fill="#8d96a0" opacity="0.4"/>
    <circle cx="40" cy="190" r="10" fill="#8d96a0" opacity="0.4"/>
    
    <!-- Top Bar -->
    <rect class="layer" x="80" y="10" width="280" height="40" rx="8" />
    <rect class="layer-accent" x="95" y="22" width="100" height="15" rx="4" />
    
    <!-- Circular Progress Rings -->
    <g transform="translate(80, 60)">
      <rect class="layer" x="0" y="0" width="135" height="140" rx="8" />
      <circle cx="67.5" cy="70" r="35" fill="none" stroke="#e1e4e8" stroke-width="10" />
      <circle cx="67.5" cy="70" r="35" fill="none" stroke="#d4a72c" stroke-width="10" stroke-dasharray="160 220" stroke-linecap="round" transform="rotate(-90 67.5 70)" />
      <text x="67.5" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">72%</text>
    </g>
    
    <g transform="translate(225, 60)">
      <rect class="layer" x="0" y="0" width="135" height="140" rx="8" />
      <circle cx="67.5" cy="70" r="35" fill="none" stroke="#e1e4e8" stroke-width="10" />
      <circle cx="67.5" cy="70" r="35" fill="none" stroke="#2da44e" stroke-width="10" stroke-dasharray="190 220" stroke-linecap="round" transform="rotate(-90 67.5 70)" />
      <text x="67.5" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">85%</text>
    </g>
    
    <!-- Bar Chart -->
    <g transform="translate(80, 210)">
      <rect class="layer" x="0" y="0" width="280" height="130" rx="8" />
      <!-- Grid lines -->
      <line x1="20" y1="100" x2="260" y2="100" stroke="#8d96a0" stroke-width="2" />
      
      <!-- Bars -->
      <rect class="layer-accent" x="40" y="40" width="25" height="60" rx="4" />
      <rect class="layer-accent" x="80" y="20" width="25" height="80" rx="4" />
      <rect class="layer-accent" x="120" y="60" width="25" height="40" rx="4" />
      <rect class="layer-accent" x="160" y="30" width="25" height="70" rx="4" />
      <rect class="layer-accent" x="200" y="10" width="25" height="90" rx="4" />
    </g>
  </g>
</svg>
